---
# Values from the post's "Complete Production Example" (PostgreSQL + Redis).
haproxy_tcp_lb_maxconn: 100000
haproxy_tcp_lb_nbthread: 4
haproxy_tcp_lb_cpu_map: "auto:1/1-4 0-3"

haproxy_tcp_lb_stats_port: 8404

# PostgreSQL check user, for "option pgsql-check" (pg_replicas) and the primary check (pg_primary).
# The primary check logs in to read in_hot_standby: trust this role from the HAProxy address
# in pg_hba.conf (see the post). It needs no privileges.
haproxy_tcp_lb_pgsql_check_user: haproxy
haproxy_tcp_lb_pg_check_database: postgres
haproxy_tcp_lb_pg_write_port: 5432
haproxy_tcp_lb_pg_read_port: 5433
haproxy_tcp_lb_pg_max_frontend_conns: 5000

# Read/write traffic: the primary, with a standby as backup
haproxy_tcp_lb_pg_primary_servers:
  - {name: pg-primary, address: 192.168.1.10, port: 5432}
  - {name: pg-standby1, address: 192.168.1.11, port: 5432, backup: true}

# Read-only traffic: the standbys (leastconn), the primary as fallback
haproxy_tcp_lb_pg_replica_servers:
  - {name: pg-standby1, address: 192.168.1.11, port: 5432}
  - {name: pg-standby2, address: 192.168.1.12, port: 5432}
  - {name: pg-primary, address: 192.168.1.10, port: 5432, backup: true, comment: Fallback}

# Redis: "balance first" plus a check for role:master sends all traffic to the master
haproxy_tcp_lb_redis_port: 6379
haproxy_tcp_lb_redis_servers:
  - {name: redis1, address: 192.168.1.20, port: 6379}
  - {name: redis2, address: 192.168.1.21, port: 6379}
  - {name: redis3, address: 192.168.1.22, port: 6379}
